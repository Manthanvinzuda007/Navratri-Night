<!doctype html>
<html lang="gu">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#2a0716" />
    <title>Navratri Garba - Jai Maa Ambe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;800&family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --gold: #ffc94a;
        --gold2: #ffe29a;
        --ruby: #c2185b;
        --deep: #2a0716;
        --glass: rgba(52, 12, 34, 0.55);
        --line: rgba(255, 201, 74, 0.38);
        --sai-t: env(safe-area-inset-top, 0px);
        --sai-b: env(safe-area-inset-bottom, 0px);
        --sai-l: env(safe-area-inset-left, 0px);
        --sai-r: env(safe-area-inset-right, 0px);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05050f;
        font-family: "Poppins", "Noto Sans Gujarati", system-ui, sans-serif;
        color: #fff;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #c {
        position: fixed;
        inset: 0;
      }
      #c canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .hud {
        position: fixed;
        pointer-events: none;
      }
      .btn {
        pointer-events: auto;
        background: linear-gradient(180deg, #d81b60, #a3124a);
        border: 2px solid var(--gold);
        color: #fff;
        border-radius: 14px;
        padding: 10px 18px;
        font: 600 15px/1.1 inherit;
        font-family: inherit;
        cursor: pointer;
        margin: 4px;
        transition:
          transform 0.12s,
          box-shadow 0.2s,
          filter 0.2s;
        box-shadow:
          0 4px 14px rgba(0, 0, 0, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.25);
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow:
          0 8px 22px rgba(255, 201, 74, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.3);
        filter: brightness(1.1);
      }
      .btn:active {
        transform: scale(0.93);
      }
      .btn.sel {
        background: linear-gradient(180deg, #ffe29a, #ffc94a);
        color: #4a0d3a;
        font-weight: 700;
      }
      .btn.big {
        padding: 16px 38px;
        font-size: 20px;
        border-radius: 18px;
        background: linear-gradient(180deg, #ffd978, #f5a623);
        color: #3d0a22;
        border-color: #fff3c4;
        font-weight: 700;
        letter-spacing: 0.5px;
        animation: pulseBtn 2.2s infinite;
      }
      .btn.sm {
        padding: 6px 12px;
        font-size: 13px;
        border-radius: 10px;
      }
      .btn[disabled] {
        opacity: 0.45;
        filter: grayscale(0.6);
        pointer-events: none;
      }
      @keyframes pulseBtn {
        50% {
          box-shadow:
            0 0 28px rgba(255, 201, 74, 0.7),
            0 4px 14px rgba(0, 0, 0, 0.4);
        }
      }
      .menu {
        position: fixed;
        inset: 0;
        overflow-y: auto;
        overflow-x: hidden;
        touch-action: pan-y;
        -webkit-overflow-scrolling: touch;
        background: radial-gradient(
          ellipse at 50% -10%,
          #8a1f4a 0,
          #4a0d34 38%,
          #1a0517 70%,
          #07030d 100%
        );
        padding: calc(var(--sai-t) + 14px) 14px calc(var(--sai-b) + 28px);
      }
      .menu:before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.22;
        background-image: radial-gradient(
          circle,
          #ffc94a 1.4px,
          transparent 2px
        );
        background-size: 26px 26px;
        mask-image: radial-gradient(circle at 50% 0, #000, transparent 75%);
        -webkit-mask-image: radial-gradient(
          circle at 50% 0,
          #000,
          transparent 75%
        );
      }
      .toran {
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        height: 46px;
        pointer-events: none;
        z-index: 2;
        background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='46'><path d='M0 6 Q32 16 64 6' stroke='%23c2185b' stroke-width='3' fill='none'/><path d='M12 10 L22 10 L17 34Z' fill='%232e7d32'/><path d='M42 10 L52 10 L47 34Z' fill='%232e7d32'/><circle cx='32' cy='17' r='7' fill='%23ff8f00'/><circle cx='32' cy='17' r='3.4' fill='%23ffd54f'/><circle cx='32' cy='33' r='5' fill='%23ffb300'/><circle cx='4' cy='9' r='4' fill='%23ff6d00'/></svg>")
          repeat-x;
        filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.5));
      }
      .wrap {
        max-width: 1080px;
        margin: 0 auto;
        position: relative;
        z-index: 1;
        padding-top: 34px;
      }
      .title {
        text-align: center;
        margin: 6px 0 2px;
      }
      .title .gu {
        font:
          800 clamp(38px, 8vw, 80px)/1.15 "Noto Sans Gujarati",
          sans-serif;
        background: linear-gradient(180deg, #fff6cf, #ffc94a 55%, #f08c00);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 18px rgba(255, 120, 60, 0.55));
        animation: glow 3s infinite;
      }
      .title .en {
        font: 700 clamp(15px, 2.6vw, 24px) "Poppins";
        letter-spacing: 0.38em;
        text-transform: uppercase;
        color: var(--gold2);
        margin-top: -4px;
      }
      @keyframes glow {
        50% {
          filter: drop-shadow(0 0 30px rgba(255, 201, 74, 0.9));
        }
      }
      .grid {
        display: grid;
        grid-template-columns: 1.6fr 1fr;
        gap: 14px;
        margin-top: 16px;
      }
      @media (max-width: 860px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
      .panel {
        background: var(--glass);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 14px 16px;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        box-shadow:
          0 10px 34px rgba(0, 0, 0, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.12);
        position: relative;
      }
      .panel h3 {
        margin: 0 0 10px;
        font: 700 13px "Poppins";
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--gold);
      }
      .panel h3 span {
        font-family: "Noto Sans Gujarati";
        letter-spacing: 0;
        text-transform: none;
        opacity: 0.8;
        margin-left: 8px;
        font-weight: 600;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .card {
        flex: 1 1 150px;
        min-width: 140px;
        text-align: left;
        background: rgba(255, 255, 255, 0.06);
        border: 1.5px solid rgba(255, 201, 74, 0.25);
        border-radius: 14px;
        padding: 10px 12px;
        cursor: pointer;
        color: #fff;
        font-family: inherit;
        transition: all 0.18s;
        position: relative;
        touch-action: manipulation;
      }
      .card:hover {
        transform: translateY(-2px);
        border-color: var(--gold);
        background: rgba(255, 201, 74, 0.12);
      }
      .card.sel {
        background: linear-gradient(
          160deg,
          rgba(255, 201, 74, 0.3),
          rgba(216, 27, 96, 0.35)
        );
        border-color: var(--gold2);
        box-shadow: 0 0 22px rgba(255, 201, 74, 0.3);
      }
      .card b {
        display: block;
        font-size: 15px;
      }
      .card small {
        display: block;
        opacity: 0.75;
        font-size: 11.5px;
        line-height: 1.35;
        margin-top: 3px;
      }
      .card .gu {
        font-family: "Noto Sans Gujarati";
        color: var(--gold2);
        font-size: 12px;
      }
      .card.lock {
        opacity: 0.5;
      }
      .card .lk {
        position: absolute;
        right: 8px;
        top: 6px;
        font-size: 12px;
        background: rgba(0, 0, 0, 0.55);
        padding: 2px 7px;
        border-radius: 9px;
      }
      .sw {
        display: inline-flex;
        height: 34px;
        width: 64px;
        border-radius: 12px;
        overflow: hidden;
        border: 2px solid rgba(255, 255, 255, 0.3);
        cursor: pointer;
        position: relative;
        margin: 3px;
        transition: transform 0.15s;
        touch-action: manipulation;
      }
      .sw:hover {
        transform: scale(1.07);
      }
      .sw.sel {
        border-color: var(--gold2);
        box-shadow: 0 0 14px var(--gold);
      }
      .sw i {
        flex: 1;
      }
      .sw.lock {
        filter: grayscale(0.85) brightness(0.55);
      }
      .sw em {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 700 11px Poppins;
        font-style: normal;
        text-shadow: 0 1px 3px #000;
      }
      .bar {
        height: 10px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.45);
        overflow: hidden;
        border: 1px solid rgba(255, 201, 74, 0.25);
      }
      .bar > div {
        height: 100%;
        background: linear-gradient(90deg, #ff9800, #e91e63, #9c27b0);
        transition: width 0.15s;
      }
      .stat {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        padding: 5px 0;
        border-bottom: 1px dashed rgba(255, 201, 74, 0.18);
      }
      .stat b {
        color: var(--gold2);
      }
      .night {
        flex: 1 1 92px;
        min-width: 92px;
        padding: 8px;
        border-radius: 12px;
        text-align: center;
        cursor: pointer;
        border: 1.5px solid rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.06);
        color: #fff;
        font-family: inherit;
        touch-action: manipulation;
      }
      .night.sel {
        border-color: var(--gold2);
        box-shadow: 0 0 16px var(--gold);
      }
      .night.lock {
        opacity: 0.4;
      }
      .night b {
        display: block;
        font-size: 11px;
      }
      .night span {
        font: 600 11px "Noto Sans Gujarati";
      }
      .night .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        margin: 0 auto 4px;
      }
      .diyas {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 90px;
        pointer-events: none;
        z-index: 0;
        opacity: 0.9;
      }
      .diya {
        position: absolute;
        bottom: 10px;
        width: 26px;
        height: 12px;
        background: linear-gradient(#c4561f, #8a3410);
        border-radius: 0 0 26px 26px;
      }
      .diya:after {
        content: "";
        position: absolute;
        left: 9px;
        top: -17px;
        width: 8px;
        height: 18px;
        background: radial-gradient(
          ellipse at 50% 80%,
          #fff6c0,
          #ffb300 50%,
          rgba(255, 120, 0, 0) 72%
        );
        border-radius: 50% 50% 50% 50%/60% 60% 40% 40%;
        animation: fl 1s infinite alternate;
        filter: blur(0.4px);
      }
      @keyframes fl {
        0% {
          transform: scaleY(0.85) skewX(-4deg);
        }
        100% {
          transform: scaleY(1.15) skewX(4deg);
        }
      }
      .rng {
        position: fixed;
        left: 50%;
        top: 50%;
        width: min(130vmin, 1100px);
        height: min(130vmin, 1100px);
        margin: calc(min(130vmin, 1100px) / -2) 0 0
          calc(min(130vmin, 1100px) / -2);
        opacity: 0.1;
        animation: spin 140s linear infinite;
        pointer-events: none;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .ov {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 20;
        background: rgba(10, 2, 10, 0.62);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        padding: 16px;
        touch-action: pan-y;
        overflow-y: auto;
      }
      .modal {
        width: min(520px, 100%);
        max-height: 100%;
        overflow-y: auto;
      }
      .hud-card {
        background: var(--glass);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 8px 14px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      }
      .msg {
        position: fixed;
        top: 24%;
        left: 0;
        right: 0;
        text-align: center;
        font: 800 clamp(26px, 5.5vw, 46px) Poppins;
        color: var(--gold2);
        text-shadow:
          0 0 14px rgba(255, 150, 0, 0.8),
          0 3px 6px #000;
        pointer-events: none;
        animation: pop 0.75s ease-out both;
      }
      .msg.p3 {
        color: #fff3b0;
        text-shadow:
          0 0 22px #ffb300,
          0 0 6px #ff6f00;
      }
      .msg.m {
        color: #ff8a80;
        text-shadow:
          0 0 12px #c62828,
          0 2px 4px #000;
        font-size: clamp(20px, 4vw, 32px);
      }
      .msg.fever {
        color: #ff80ab;
        text-shadow: 0 0 24px #e91e63;
      }
      @keyframes pop {
        0% {
          transform: scale(0.4);
          opacity: 0;
        }
        18% {
          transform: scale(1.18);
          opacity: 1;
        }
        35% {
          transform: scale(1);
        }
        80% {
          opacity: 1;
        }
        100% {
          transform: translateY(-22px);
          opacity: 0;
        }
      }
      .banner {
        position: fixed;
        top: 12%;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 26px;
        border-radius: 40px;
        background: linear-gradient(
          90deg,
          rgba(194, 24, 91, 0),
          rgba(194, 24, 91, 0.85),
          rgba(194, 24, 91, 0)
        );
        font:
          800 clamp(18px, 4vw, 32px) "Noto Sans Gujarati",
          Poppins;
        color: #fff3c4;
        text-shadow: 0 0 14px #ffb300;
        white-space: nowrap;
        animation: ban 2.4s ease-out both;
        pointer-events: none;
      }
      @keyframes ban {
        0% {
          opacity: 0;
          transform: translateX(-50%) scale(0.6);
        }
        12% {
          opacity: 1;
          transform: translateX(-50%) scale(1.05);
        }
        20% {
          transform: translateX(-50%) scale(1);
        }
        85% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      .cd {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 800 min(36vmin, 260px) Poppins;
        color: #ffe29a;
        text-shadow:
          0 0 40px #ff9800,
          0 0 8px #000;
        pointer-events: none;
        animation: cd 0.5s ease-out both;
      }
      @keyframes cd {
        0% {
          transform: scale(1.6);
          opacity: 0;
        }
        25% {
          opacity: 1;
        }
        100% {
          transform: scale(0.9);
          opacity: 0.7;
        }
      }
      .lane {
        display: flex;
        gap: 7px;
        align-items: center;
        justify-content: center;
        padding: 7px 14px;
        border-radius: 30px;
        background: rgba(30, 6, 24, 0.55);
        border: 1px solid var(--line);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      .ld {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.14);
        transition:
          transform 0.08s,
          background 0.08s,
          box-shadow 0.08s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        color: #fff;
      }
      .ld.clap {
        width: 28px;
        height: 28px;
        background: radial-gradient(circle at 35% 30%, #ffe29a, #f5a623);
        box-shadow: 0 0 8px rgba(255, 180, 50, 0.6);
      }
      .ld.twirl {
        width: 28px;
        height: 28px;
        background: rgba(194, 24, 91, 0.6);
        border: 2px solid #ff80ab;
      }
      .ld.twirl:after {
        content: "↻";
        font-weight: 700;
      }
      .ld.on {
        transform: scale(1.35);
        box-shadow:
          0 0 16px #fff,
          0 0 28px var(--gold);
        background: #fff;
      }
      .ld.twirl.on {
        background: #ff80ab;
      }
      .clapbtn {
        pointer-events: auto;
        width: clamp(86px, 16vmin, 128px);
        height: clamp(86px, 16vmin, 128px);
        border-radius: 50%;
        border: 3px solid #fff3c4;
        background: radial-gradient(
          circle at 35% 28%,
          #ffe9a8,
          #f5a623 55%,
          #c77700
        );
        color: #3d0a22;
        font: 800 clamp(16px, 3vmin, 22px) Poppins;
        box-shadow:
          0 8px 24px rgba(0, 0, 0, 0.5),
          0 0 22px rgba(255, 201, 74, 0.45);
        touch-action: none;
        transition: transform 0.06s;
      }
      .clapbtn:active {
        transform: scale(0.88);
      }
      .joy {
        pointer-events: auto;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        border: 2px solid rgba(255, 201, 74, 0.4);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        touch-action: none;
      }
      .pill {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 12px;
        background: rgba(255, 201, 74, 0.18);
        border: 1px solid var(--line);
        font-size: 12px;
        margin-right: 6px;
      }
      .big-n {
        font: 800 28px/1 Poppins;
        color: var(--gold2);
      }
      .grade {
        font: 800 78px/1 Poppins;
        background: linear-gradient(180deg, #fff6cf, #ffb300);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 16px rgba(255, 150, 0, 0.7));
      }
      .star {
        font-size: 34px;
        filter: grayscale(1) brightness(0.5);
      }
      .star.on {
        filter: drop-shadow(0 0 8px #ffb300);
      }
      input[type="range"] {
        width: 100%;
        accent-color: #ffc94a;
      }
      .loading {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at 50% 40%, #5a1040, #12040f);
        gap: 14px;
      }
      .spin {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        border: 5px solid rgba(255, 201, 74, 0.25);
        border-top-color: var(--gold);
        animation: spin 0.9s linear infinite;
      }
      @media (pointer: coarse) {
        .btn {
          padding: 13px 18px;
          font-size: 17px;
        }
        .btn.sm {
          padding: 9px 13px;
        }
      }
      @media (max-height: 520px) and (orientation: landscape) {
        .msg {
          top: 18%;
        }
        .banner {
          top: 8%;
        }
      }
      @media (max-width: 640px) and (orientation: portrait) {
        .hud-mid {
          top: calc(var(--sai-t) + 108px) !important;
        }
      }
      @media (max-width: 640px) and (orientation: landscape) {
        .hud-mid {
          top: auto !important;
          bottom: calc(var(--sai-b, 0px) + 56px) !important;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .title .gu,
        .btn.big,
        .rng {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
      "use strict";
      /* =====================================================================
   NAVRATRI GARBA – JAI MAA AMBE  (single-file WebGL game)
   Sections: 1 Config · 2 Progression · 3 Textures · 4 Characters ·
   5 Animation · 6 Environment · 7 Audio · 8 Rhythm · 9 VFX · 10 Camera ·
   11 Game loop/Performance/Cleanup · 12 UI/Input
   ===================================================================== */
      const h = React.createElement,
        { useState, useEffect, useRef, useCallback } = React;
      const TAU = Math.PI * 2,
        PI = Math.PI;
      const clamp = (v, a, b) => (v < a ? a : v > b ? b : v),
        lerp = (a, b, t) => a + (b - a) * t,
        sstep = (t) => t * t * (3 - 2 * t),
        fract = (v) => v - Math.floor(v);
      const rnd = (a, b) => a + Math.random() * (b - a),
        pick = (a) => a[(Math.random() * a.length) | 0];
      function rng(seed) {

      const cvs = (w, hh) => {

      function ctex(cv, o) {
        o = o || {};

        if (o.rep) {

        g.addColorStop(0, "rgba(255,255,255,1)");

      /* rangoli / mandala: radial-symmetric flower pattern */
      function texMandala(S, pal, rings) {
        const c = cvs(S),
          x = c.getContext("2d"),
          m = S / 2;
        x.translate(m, m);
        x.clearRect(-m, -m, S, S);

          const n = 8 + r * 4,
            rr = m * (0.93 - r * (0.82 / R)),
            col = pal[r % pal.length],
            col2 = pal[(r + 2) % pal.length];
          for (let k = 0; k < n; k++) {
            x.save();
            x.rotate((k / n) * TAU);
            x.fillStyle = col;
            x.beginPath();
            x.ellipse(rr * 0.78, 0, rr * 0.17, rr * 0.075, 0, 0, TAU);
            x.fill();
            x.fillStyle = col2;
            x.beginPath();
            x.arc(rr * 0.99, 0, rr * 0.032, 0, TAU);
            x.fill();

            x.beginPath();
            x.arc(rr * 0.78, 0, rr * 0.026, 0, TAU);
            x.fill();
            x.restore();

          x.lineWidth = S / 160;

          x.arc(0, 0, rr * 0.58, 0, TAU);

      /* fabric packs: R = shade, G = embroidery mask (takes the trim colour), mr: G rough, B metal (mirror-work) */
      function fabricPack(kind) {
        const W = kind == "ghagra" ? 512 : 256,
          H = kind == "dupatta" ? 512 : kind == "ghagra" ? 512 : 256,
          px = cvs(W, H),
          mr = cvs(W, H),
          x = px.getContext("2d"),
          m = mr.getContext("2d");
        const base = kind == "plain" ? 236 : kind == "dupatta" ? 238 : 228;
        x.fillStyle = `rgb(${base},0,0)`;
        x.fillRect(0, 0, W, H);
        m.fillStyle = "rgb(0,205,0)";
        m.fillRect(0, 0, W, H);
        for (let i = 0; i < (W * H) / 20; i++) {
          const v = (base - 34 + Math.random() * 44) | 0;
          x.fillStyle = `rgb(${v},0,0)`;
          x.fillRect(
            Math.random() * W,
            Math.random() * H,
            Math.random() < 0.5 ? 3 : 1,
            Math.random() < 0.5 ? 1 : 3,
          );

        const gold = "rgb(255,255,0)",
          thread = "rgb(150,0,0)";
        const dot = (px_, py, r, mirror) => {
          x.fillStyle = gold;
          x.beginPath();
          x.arc(px_, py, r, 0, TAU);
          x.fill();
          m.fillStyle = "rgb(0,170,0)";
          m.beginPath();
          m.arc(px_, py, r, 0, TAU);
          m.fill();
          if (mirror) {
            x.fillStyle = "rgb(255,60,0)";
            x.beginPath();
            x.arc(px_, py, r * 0.62, 0, TAU);
            x.fill();
            m.fillStyle = "rgb(0,28,255)";
            m.beginPath();
            m.arc(px_, py, r * 0.62, 0, TAU);
            m.fill();
          }
        };
        const flower = (cx, cy, R, n) => {
          for (let k = 0; k < n; k++) {
            const a = (k / n) * TAU;
            x.save();
            x.translate(cx, cy);
            x.rotate(a);
            x.strokeStyle = gold;
            x.lineWidth = 2.4;
            x.beginPath();
            x.ellipse(R * 0.55, 0, R * 0.42, R * 0.17, 0, 0, TAU);
            x.stroke();
            x.fillStyle = gold;
            x.beginPath();
            x.arc(R * 1.02, 0, R * 0.08, 0, TAU);
            x.fill();
            x.restore();
          }

          x.strokeStyle = gold;
          x.lineWidth = 2;
          x.beginPath();
          x.arc(cx, cy, R * 0.34, 0, TAU);
          x.stroke();

          }
          for (let i = 0; i < 8; i++) {
            flower(W / 16 + (i * W) / 8, H * 0.5, 19, 6);
          }
          for (let i = 0; i < 16; i++)
            for (let j = 0; j < 3; j++) {
              if ((i + j) % 2)
                dot(W / 32 + (i * W) / 16, H * (0.37 + j * 0.045), 2.4, j == 1);
            }
          x.fillStyle = "rgb(255,0,0)";
          x.fillRect(0, H * 0.72, W, H * 0.28);
          m.fillStyle = "rgb(0,150,0)";
          m.fillRect(0, H * 0.72, W, H * 0.28); /* hem border: lighter */

      /* ---- materials ---- */
      function fabricMat(pk, inst, lam, dbl) {
        const o = { map: pk.pack, side: dbl ? 2 : 0 };
        if (!lam) {
          o.roughness = 1;
          o.metalness = 1;
          o.roughnessMap = pk.mr;
          o.metalnessMap = pk.mr;
        }
        const m = lam
            ? new THREE.MeshLambertMaterial(o)
            : new THREE.MeshStandardMaterial(o),
          u = {
            uTint: { value: new THREE.Color(1, 1, 1) },
            uTrim: { value: new THREE.Color(1, 0.8, 0.3) },
          };
        m.userData.u = u;
        m.onBeforeCompile = (s) => {
          s.uniforms.uTint = u.uTint;
          s.uniforms.uTrim = u.uTrim;
          s.vertexShader = s.vertexShader
            .replace(
              "#include <common>",
              "#include <common>\n" +
                (inst
                  ? "attribute vec3 aTint;attribute vec3 aTrim;"
                  : "uniform vec3 uTint;uniform vec3 uTrim;") +
                "\nvarying vec3 vTint;varying vec3 vTrim;",
            )
            .replace(
              "#include <begin_vertex>",
              "#include <begin_vertex>\n" +
                (inst
                  ? "vTint=aTint;vTrim=aTrim;"
                  : "vTint=uTint;vTrim=uTrim;"),
            );
          s.fragmentShader = s.fragmentShader
            .replace(
              "#include <common>",
              "#include <common>\nvarying vec3 vTint;varying vec3 vTrim;",
            )
            .replace(
              "#include <map_fragment>",
              "#ifdef USE_MAP\n vec4 pk=texture2D(map,vUv);diffuseColor.rgb=mix(vTint*pk.r,vTrim*(.55+.55*pk.r),pk.g);\n#endif",
            );

      /* ============================ 6c. ENVIRONMENT – festival ground (gate, stalls, seating, lights, skyline) ============================ */

        {

            h(
              "div",
              { key: "b" + hud.bannerId, className: "banner" },
              hud.banner,
            ),
          hud.cd > 0 &&
            h("div", { key: "cd" + hud.cd, className: "cd" }, hud.cd),
          pr &&
            !loading &&
            h(
              "div",
              {
                className: "hud",
                style: {
                  left: 0,
                  right: 0,
                  bottom: "18%",
                  textAlign: "center",
                  zIndex: 4,
                  animation: "pop 6s both",
                },
              },
              h(
                "div",
                { className: "title" },
                h(
                  "div",
                  {
                    className: "gu",
                    style: { fontSize: "clamp(30px,7vw,64px)" },
                  },
                  GU.title,
                ),
                h(
                  "div",
                  {
                    style: {
                      fontSize: 13,
                      opacity: 0.85,
                      letterSpacing: ".2em",
                    },
                  },
                  "NAVRATRI GARBA · TAP OR PRESS SPACE TO SKIP",
                ),
              ),
            ),
          h(
            "div",
            {
              className: "hud",
              style: {
                bottom: "calc(var(--sai-b) + 128px)",
                width: "100%",
                display: "flex",
                justifyContent: "center",
                zIndex: 4,
              },
            },
            h(
              "div",
              { ref: lane, className: "lane" },
              [0, 1, 2, 3, 4, 5, 6, 7].map((i) =>
                h("span", { key: i, className: "ld step" }),
              ),
            ),
          ),
          h(
            "div",
            {
              className: "hud",
              style: {
                bottom: "calc(var(--sai-b) + 30px)",
                left: "50%",
                width: 90,
                height: 90,
                marginLeft: -45,
                zIndex: 4,
              },
            },
            h("div", {
              ref: ring,
              style: {
                position: "absolute",
                inset: 20,
                border: "3px solid #ffd54f",
                borderRadius: "50%",
              },
            }),
            h("div", {
              ref: dot,
              style: {
                position: "absolute",
                inset: 20,
                border: "3px solid #fff",
                borderRadius: "50%",
                background: "rgba(255,64,129,.5)",
              },
            }),
          ),
          h(
            "div",
            {
              className: "hud",
              style: {
                bottom: "calc(var(--sai-b) + 12px)",
                left: "50%",
                width: "min(240px,40vw)",
                marginLeft: "calc(min(240px,40vw)/-2)",
                zIndex: 4,
              },
            },
            h(
              "div",
              { className: "bar" },
              h("div", {
                style: {
                  width: (hud.meter || 0) + "%",
                  background: hud.fever
                    ? "linear-gradient(90deg,#ffd54f,#ff4081,#fff)"
                    : undefined,
                },
              }),
            ),
          ),
          h(
            "div",
            {
              className: "hud",
              style: {
                bottom: "calc(var(--sai-b) + 1px)",
                width: "100%",
                textAlign: "center",
                fontSize: 10,
                opacity: 0.8,
                zIndex: 4,
              },
            },
            hud.fever ? "GARBA FEVER x2" : "Garba Meter",
          ),
          h(
            "div",
            {
              className: "hud",
              style: {
                bottom: "calc(var(--sai-b) + 26px)",
                right: "calc(var(--sai-r) + 18px)",
                pointerEvents: "auto",
                zIndex: 5,
              },
            },
            h(
              "button",
              {
                className: "clapbtn",
                onPointerDown: (e) => {
                  e.preventDefault();
                  api.current.clap && api.current.clap();
                },
              },
              "CLAP",
            ),
          ),
          touch &&
            h(
              "div",
              {
                className: "hud joy",
                style: {
                  bottom: "calc(var(--sai-b) + 26px)",
                  left: "calc(var(--sai-l) + 18px)",
                  width: 110,
                  height: 110,
                  zIndex: 5,
                },
                onPointerDown: (e) => {
                  e.currentTarget.setPointerCapture(e.pointerId);
                  jv(e);
                },
                onPointerMove: (e) => {
                  if (e.buttons) jv(e);
                },
                onPointerUp: jend,
                onPointerCancel: jend,
              },
              h("div", {
                ref: knob,
                style: {
                  position: "absolute",
                  left: 35,
                  top: 35,
                  width: 40,
                  height: 40,
                  borderRadius: "50%",
                  background: "rgba(255,213,79,.85)",
                  boxShadow: "0 0 14px rgba(255,201,74,.7)",
                },
              }),
            ),
          paused &&
            !showSet &&
            h(
              "div",
              { className: "ov" },
              h(
                "div",
                { className: "panel modal", style: { textAlign: "center" } },
                h(
                  "div",
                  { className: "grade", style: { fontSize: 40 } },
                  "Paused",
                ),
                h(
                  "div",
                  { style: { marginTop: 10 } },
                  h(
                    "button",
                    {
                      className: "btn big",
                      onClick: () => {
                        sfx("click");
                        togglePause();
                      },
                    },
                    "Resume",
                  ),
                ),
                h(
                  "div",
                  null,
                  h(
                    "button",
                    { className: "btn", onClick: () => setShowSet(true) },
                    "⚙ Settings",
                  ),
                  h(
                    "button",
                    {
                      className: "btn",
                      onClick: () => {
                        setRunId((r) => r + 1);
                        setRes(null);
                      },
                    },
                    "↻ Restart",
                  ),
                  h(
                    "button",
                    { className: "btn", onClick: () => setScr("menu") },
                    "Menu",
                  ),
                ),
              ),
            ),
          showSet &&
            h(Settings, {
              save,
              q,
              setQ,
              onClose: () => setShowSet(false),
              onApply: () =>
                api.current.applySettings && api.current.applySettings(),
            }),
          res &&
            h(
              "div",
              { className: "ov" },
              h(
                "div",
                { className: "panel modal", style: { textAlign: "center" } },
                h(
                  "h3",
                  null,
                  res.why == "fail"
                    ? "The blessings have run out"
                    : res.gm == "festival"
                      ? "Night " + (res.night + 1) + " · " + NIGHTS[res.night].n
                      : "Results",
                  h("span", null, "પરિણામ"),
                ),
                h("div", { className: "grade" }, res.grade),
                h(
                  "div",
                  null,
                  [0, 1, 2].map((i) =>
                    h(
                      "span",
                      {
                        key: i,
                        className: "star" + (i < res.stars ? " on" : ""),
                      },
                      "★",
                    ),
                  ),
                ),
                h(
                  "div",
                  { className: "big-n", style: { margin: "8px 0" } },
                  res.score.toLocaleString() + (res.nb ? "  🏆 New best!" : ""),
                ),
                h(
                  "div",
                  { style: { textAlign: "left" } },
                  h(
                    "div",
                    { className: "stat" },
                    "Accuracy",
                    h("b", null, res.acc.toFixed(1) + "%"),
                  ),
                  h(
                    "div",
                    { className: "stat" },
                    "Perfect / Great / Good",
                    h(
                      "b",
                      null,
                      res.perfect + " / " + res.great + " / " + res.good,
                    ),
                  ),
                  h(
                    "div",
                    { className: "stat" },
                    "Misses",
                    h("b", null, res.miss),
                  ),
                  h(
                    "div",
                    { className: "stat" },
                    "Best combo",
                    h("b", null, res.maxCombo),
                  ),
                  h(
                    "div",
                    { className: "stat" },
                    "XP earned",
                    h("b", null, "+" + res.xp),
                  ),
                ),
                res.lv1 > res.lv0 &&
                  h(
                    "div",
                    {
                      style: {
                        margin: "10px 0",
                        color: "#ffe29a",
                        fontWeight: 700,
                      },
                    },
                    "🎉 Level " + res.lv1 + "!",
                    res.un.map((u, i) =>
                      h(
                        "div",
                        { key: i, style: { fontSize: 12, fontWeight: 400 } },
                        "Unlocked – " + u,
                      ),
                    ),
                  ),
                res.gm == "festival" &&
                  res.stars >= 1 &&
                  res.night < 8 &&
                  h(
                    "div",
                    {
                      style: {
                        fontSize: 12,
                        margin: "6px 0",
                        color: "#b9f6ca",
                      },
                    },
                    "Night " + (res.night + 2) + " unlocked!",
                  ),
                h(
                  "div",
                  { style: { marginTop: 8 } },
                  res.gm == "festival" &&
                    res.stars >= 1 &&
                    res.night < 8 &&
                    h(
                      "button",
                      {
                        className: "btn big",
                        onClick: () => {
                          setNight(res.night + 1);
                          setCfg((c) =>
                            Object.assign({}, c, { night: res.night + 1 }),
                          );
                          setRes(null);
                          setRunId((r) => r + 1);
                        },
                      },
                      "Next Night ▶",
                    ),
                  h(
                    "button",
                    {
                      className:
                        "btn" +
                        (res.gm == "festival" && res.stars >= 1 && res.night < 8
                          ? ""
                          : " big"),
                      onClick: () => {
                        setRes(null);
                        setRunId((r) => r + 1);
                      },
                    },
                    "Play Again",
                  ),
                  h(
                    "button",
                    { className: "btn", onClick: () => setScr("menu") },
                    "Menu",
                  ),
                ),
              ),
            ),
          loading &&
            h(
              "div",
              { className: "loading" },
              h("div", { className: "spin" }),
              h(
                "div",
                {
                  style: {
                    fontFamily: GU.font,
                    fontSize: 22,
                    color: "#ffe29a",
                  },
                },
                GU.welcome,
              ),
              h(
                "div",
                { style: { opacity: 0.8, fontSize: 13 } },
                "Preparing the Garba ground…",
              ),
            ),
          err &&
            h(
              "div",
              { className: "ov", style: { zIndex: 40 } },
              h(
                "div",
                { className: "panel modal" },
                h("h3", null, "Something went wrong"),
                h(
                  "pre",
                  {
                    style: {
                      whiteSpace: "pre-wrap",
                      fontSize: 11,
                      maxHeight: "40vh",
                      overflow: "auto",
                      userSelect: "text",
                    },
                  },
                  err,
                ),
                h(
                  "button",
                  {
                    className: "btn",
                    onClick: () => {
                      setErr(null);
                      setScr("menu");
                    },
                  },
                  "Back to menu",
                ),
              ),
            ),
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(h(App));
    </script>
  </body>
</html>
